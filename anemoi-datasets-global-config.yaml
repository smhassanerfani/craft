dates:
  start: 1979-01-01T00:00:00
  end: 1979-12-31T18:00:00
  frequency: 6h

statistics:
  start: 1979
  end: 1979

input:
  join:
    - xarray-zarr:
        url: /cw3e/mead/projects/cwp167/moerfani_data/global-intermediate-zarr/1979.zarr
        variable: [u, v, t, q, z]
        level: [50, 100, 150, 200, 250, 300, 400, 500, 550, 600, 650, 700, 750, 800, 850, 900, 925, 950, 1000]
    - xarray-zarr:
        url: /cw3e/mead/projects/cwp167/moerfani_data/global-intermediate-zarr/1979.zarr
        variable: [msl, sp, d2m, 2t, iwv, ivt_u, ivt_v, 10u, 10v, z_sfc, t_sfc, lsm, tp]
    - forcings:
        template: ${input.join.0.xarray-zarr}
        param:
        - insolation
        - cos_julian_day
        - cos_local_time
        - cos_longitude
        - cos_latitude
        - sin_julian_day
        - sin_local_time
        - sin_longitude
        - sin_latitude
    